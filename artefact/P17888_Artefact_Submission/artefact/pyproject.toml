[project]
name = "p17888-controlled-chatbot"
version = "0.1.0"
description = "Deterministic non-medical supplement matching prototype for Arden project P17888"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

